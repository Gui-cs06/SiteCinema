<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style_form.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>
    <title>login</title>
</head>

<body class="light">
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <div class="logo">
                <a class="navbar-brand" href="../index.html"><img src="../img/logo.jpg" alt=""></a>
            </div>
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="../index.html">INÍCIO</a>
                <a class="nav-link" href="sobre.html">SOBRE NÓS</a>
            </div>
            <div class="pesquisa">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0">
                        <i class="fas fa-search text-muted"></i>
                    </span>
                    <input type="text" id="barraPesquisa" class="form-control border-start-0">
                </div>
            </div>
            <div class="navbar-login">
                <a id="btnSessao" class="btn btn-primary" href="login.html">ENTRAR</a>
            </div>
        </div>
    </nav>
    
    <div id="form-div">
        <section id="form">
            <div id="container-login">
                <form id="login-form" action="">
                    <label for="login" class="form-label mt-4">Login</label>
                    <input class="credenciais form-control" type="text" id="login" placeholder="Digite o login" required>
                    <label for="email" class="form-label">Email</label>
                    <input class="credenciais form-control" type="email" id="email" placeholder="Digite o email" required>
                    <label for="senha" class="form-label">Senha</label>
                    <input class="credenciais form-control" type="password" id="senha" placeholder="Digite a senha" required>
                    <button type="button" id="enviar">Entrar</button>
                </form>
    
                <div id="login-footer" class="mt-4">
                    <span>Não possui cadastro? <a href="registrar.html">Cadastre-se agora</a></span>
                </div>
            </div>
        </section>
    </div>
    <div id="toggle-theme-btn">
        <img class="toggle-theme" style="width: 30px;" src="img/DARK_MODE.png">
    </div>


    <script>
        const toggleThemeBtn = document.querySelector('.toggle-theme');
        const body = document.body;

        const temaSalvo = localStorage.getItem('tema');
        if (temaSalvo) {
            body.classList.add(temaSalvo);
        } else {
            body.classList.add('light');
        }

        const updateImage = () => {
            if (localStorage.getItem('tema') == 'light') {
                toggleThemeBtn.src = '../img/DARK_MODE.png';
            } else {
                toggleThemeBtn.src = '../img/Light_Mode.png';
            }
        };

        toggleThemeBtn.addEventListener('click', function () {
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                localStorage.setItem('tema', 'light');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                localStorage.setItem('tema', 'dark');
            }

            updateImage();
        });

        updateImage();
    </script>

    <script src="../script/login.js"></script>
</body>

</html>
